name: Ops probe

# Answers the P1-009 availability signals on a schedule and records the outcome as an issue.
#
# This is an alert, not paging: a scheduled GitHub workflow can be delayed by GitHub, consumes Actions
# minutes, and is disabled after 60 days without repository activity. docs/operations/monitoring.md
# states that limit; the runbook states what to do when the issue appears.
#
# The internal report (/health/ops) is read over the loopback port published by deploy/docker-compose.yml
# on the droplet; it is never exposed at the public edge (deploy/nginx.conf returns 404 for it).

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: ops-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 5
    env:
      PUBLIC_HOST: 138-197-15-40.sslip.io
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v5

      - name: Configure SSH (the key is never printed)
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Probe the signals
        env:
          SSH_TARGET: ${{ vars.SSH_USER }}@${{ vars.SSH_HOST }}
        run: |
          set -uo pipefail

          # A broken probe must not be mistaken for a broken service: prove the decision table first.
          if ! pwsh -NoProfile -File tools/ops-probe.ps1 -SelfTest; then
            echo "### Ops probe - the probe itself failed its self-test" >> "$GITHUB_STEP_SUMMARY"
            exit 2
          fi

          code=0
          pwsh -NoProfile -File tools/ops-probe.ps1 \
            -PublicHost "$PUBLIC_HOST" \
            -SshTarget "$SSH_TARGET" \
            -SummaryPath "$GITHUB_STEP_SUMMARY" \
            -IssueBodyPath "$RUNNER_TEMP/ops-alert.md" || code=$?

          exit "$code"

      - name: Record a failed probe as an issue
        if: failure()
        run: |
          set -euo pipefail
          label=ops-alert
          body="$RUNNER_TEMP/ops-alert.md"
          if [ ! -f "$body" ]; then
            printf 'The probe did not produce a verdict. See the run: %s/%s/actions/runs/%s\n' \
              "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > "$body"
          fi

          gh label create "$label" --color B60205 --description "Automated ops probe" >/dev/null 2>&1 || true
          number="$(gh issue list --label "$label" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file "$body"
          else
            gh issue create \
              --title "ops-alert: an availability signal is failing" \
              --body-file "$body" \
              --label "$label"
          fi

      - name: Close the issue when the probe passes
        if: success()
        run: |
          set -euo pipefail
          label=ops-alert
          number="$(gh issue list --label "$label" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$number" ]; then
            gh issue close "$number" \
              --comment "The probe passed. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi
