name: Infrastructure (Azure AI)

# Terraform runs only in CI: `plan` on pull requests, `apply` only on merge to main.
on:
  pull_request:
    paths:
      - 'infra/azure/**'
      - '.github/workflows/infrastructure.yml'
  push:
    branches: [main]
    paths:
      - 'infra/azure/**'
      - '.github/workflows/infrastructure.yml'

permissions:
  id-token: write
  contents: read

concurrency:
  group: infrastructure-${{ github.ref }}
  cancel-in-progress: false

env:
  TF_VERSION: 1.15.8
  ARM_USE_OIDC: true
  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  TF_STATE_RG: ${{ vars.TF_STATE_RG }}
  TF_STATE_SA: ${{ vars.TF_STATE_SA }}
  TF_STATE_CONTAINER: ${{ vars.TF_STATE_CONTAINER }}
  TF_STATE_KEY: convenciones-ai.tfstate
  TF_VAR_model_name: ${{ vars.TF_MODEL_NAME || 'gpt-5.4-mini' }}
  TF_VAR_model_version: ${{ vars.TF_MODEL_VERSION }}
  TF_VAR_model_format: ${{ vars.TF_MODEL_FORMAT || 'OpenAI' }}
  TF_VAR_model_sku: ${{ vars.TF_MODEL_SKU || 'DataZoneStandard' }}
  TF_VAR_model_capacity: ${{ vars.TF_MODEL_CAPACITY || '10' }}
  TF_VAR_budget_alert_email: ${{ vars.TF_BUDGET_ALERT_EMAIL }}
  TF_VAR_create_runtime_app: 'false'
  TF_VAR_runtime_app_object_id: ${{ vars.TF_RUNTIME_APP_OBJECT_ID }}

jobs:
  plan:
    if: github.event_name == 'pull_request' && vars.AZURE_CLIENT_ID != '' && vars.TF_STATE_SA != ''
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/azure
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Format check
        run: terraform fmt -check -recursive

      - name: Init
        run: |
          terraform init -input=false \
            -backend-config="resource_group_name=${TF_STATE_RG}" \
            -backend-config="storage_account_name=${TF_STATE_SA}" \
            -backend-config="container_name=${TF_STATE_CONTAINER}" \
            -backend-config="key=${TF_STATE_KEY}" \
            -backend-config="use_azuread_auth=true"

      - name: Validate
        run: terraform validate

      - name: Plan
        run: terraform plan -input=false -no-color -out=tfplan

      - name: Render plan
        run: terraform show -no-color tfplan > plan.txt

      - uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: |
            infra/azure/tfplan
            infra/azure/plan.txt
          retention-days: 7

  apply:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AZURE_CLIENT_ID != '' && vars.TF_STATE_SA != ''
    runs-on: ubuntu-latest
    environment: azure
    defaults:
      run:
        working-directory: infra/azure
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Format check
        run: terraform fmt -check -recursive

      - name: Init
        run: |
          terraform init -input=false \
            -backend-config="resource_group_name=${TF_STATE_RG}" \
            -backend-config="storage_account_name=${TF_STATE_SA}" \
            -backend-config="container_name=${TF_STATE_CONTAINER}" \
            -backend-config="key=${TF_STATE_KEY}" \
            -backend-config="use_azuread_auth=true"

      - name: Validate
        run: terraform validate

      - name: Plan
        run: terraform plan -input=false -no-color -out=tfplan

      - name: Apply
        run: terraform apply -input=false -no-color -auto-approve tfplan