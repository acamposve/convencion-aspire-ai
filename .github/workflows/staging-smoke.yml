name: Staging smoke

# Post-deploy, read-only verification. It never changes the worker state and never prints secrets.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type smoke (read-only checks) or flows (release smoke gate) to confirm'
        required: true
        type: string
      mode:
        description: 'read-only verifies the deployment; flows exercises the MVP flows on a disposable tenant'
        required: false
        default: read-only
        type: choice
        options:
          - read-only
          - flows

permissions:
  contents: read

concurrency:
  group: staging-smoke
  cancel-in-progress: false

jobs:
  smoke:
    if: github.ref == 'refs/heads/main' && github.event.inputs.confirm == 'smoke'
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Show recent processing failures (read-only)
        env:
          DB_HOST: ${{ vars.SUPABASE_DB_HOST }}
          DB_PORT: ${{ vars.SUPABASE_DB_PORT }}
          DB_NAME: ${{ vars.SUPABASE_DB_NAME }}
          DB_USER: ${{ vars.SUPABASE_DB_USER }}
          DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          PGPASSWORD="$DB_PASSWORD" PGSSLMODE=require psql \
            --host "$DB_HOST" --port "$DB_PORT" --username "$DB_USER" --dbname "$DB_NAME" \
            --no-psqlrc -c "select id, status::text, error_code, left(error_message, 500) as error_message from platform.processing_run where status in ('Failed','Running') order by updated_at desc limit 5;"
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Recent worker logs (read-only)
        if: always()
        env:
          SSH_TARGET: ${{ vars.SSH_USER }}@${{ vars.SSH_HOST }}
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$SSH_TARGET" \
            "cd /opt/convenciones && docker compose logs --no-color --tail=200 worker" || true
      - name: Read exercise identifiers (no secrets)
        env:
          SSH_TARGET: ${{ vars.SSH_USER }}@${{ vars.SSH_HOST }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$SSH_TARGET" \
            "if [ -f /opt/convenciones/.staging-ai/state.env ]; then grep -E '^(COMPANY|USER|EMAIL|DOC|RUN)_' /opt/convenciones/.staging-ai/state.env; else echo 'no exercise state'; fi"
      - name: Verify HTTPS, redirect, worker and connectivity
        env:
          SSH_TARGET: ${{ vars.SSH_USER }}@${{ vars.SSH_HOST }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$SSH_TARGET" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/convenciones
          host='138-197-15-40.sslip.io'

          echo "== HTTPS readiness =="
          curl -fsS "https://$host/health/ready"
          echo ""

          echo "== HTTP redirect =="
          code="$(curl -sS -o /dev/null -w '%{http_code}' "http://$host/health/ready")"
          location="$(curl -sS -o /dev/null -w '%{redirect_url}' "http://$host/health/ready")"
          test "$code" = "308" || test "$code" = "301"
          case "$location" in https://*) ;; *) echo "unexpected redirect: $location"; exit 1 ;; esac
          echo "http=$code -> $location"

          echo "== worker state =="
          grep -qx 'Worker__Enabled=false' .env
          echo "Worker__Enabled=false"
          docker compose ps worker
          worker_container="$(docker compose ps -q worker)"
          test -n "$worker_container"
          test "$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$worker_container")" = "healthy"

          echo "== container config presence (names only) =="
          docker compose exec -T api sh -c '
            for name in AzureAi__Endpoint AzureAi__Deployment AzureAi__ApiKey DocumentIntelligence__Endpoint DocumentIntelligence__ApiKey Documents__SupabaseUrl Documents__Bucket; do
              eval "test -n \"\$$name\"" || { echo "missing $name"; exit 1; }
            done
            echo "required configuration names present"
          '

          echo "== no .env inside the web container =="
          docker compose exec -T web sh -c 'test ! -e /app/.env && test ! -e /.env'
          echo "web container has no .env"

          echo "== dotfile is not served =="
          dot_code="$(curl -sS -o /dev/null -w '%{http_code}' "https://$host/.env")"
          test "$dot_code" = "403" || test "$dot_code" = "404"
          echo "dotfile status=$dot_code"

          echo "== Azure network reachability (unauthenticated) =="
          foundry="$(curl -sS -o /dev/null -w '%{http_code}' https://ai-convenciones-hxetrj.cognitiveservices.azure.com/ || true)"
          di="$(curl -sS -o /dev/null -w '%{http_code}' https://di-convenciones-hxetrj.cognitiveservices.azure.com/ || true)"
          echo "foundry=$foundry di=$di"
          case "$foundry" in 2*|3*|401|403|404) ;; *) echo "foundry connectivity failed"; exit 1 ;; esac
          case "$di" in 2*|3*|401|403|404) ;; *) echo "di connectivity failed"; exit 1 ;; esac

          echo "== Supabase network reachability =="
          supabase="$(curl -sS -o /dev/null -w '%{http_code}' https://ckvsbwbnhpvwdbpnyxgs.supabase.co/ || true)"
          echo "supabase=$supabase"
          case "$supabase" in 2*|3*|401|403) ;; *) echo "supabase connectivity failed"; exit 1 ;; esac
          REMOTE

  # The release smoke gate (T19 AC3). Mutating by design: it creates, publishes and then removes
  # synthetic data in a dedicated staging tenant, and it never enables the worker. Two confirmations are
  # required (mode=flows and confirm=flows), and it only runs from main, like the exercise stages.
  flows:
    name: Release smoke gate
    if: github.ref == 'refs/heads/main' && github.event.inputs.mode == 'flows' && github.event.inputs.confirm == 'flows'
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 20
    env:
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_DB_HOST: ${{ vars.SUPABASE_DB_HOST }}
      SUPABASE_DB_PORT: ${{ vars.SUPABASE_DB_PORT }}
      SUPABASE_DB_NAME: ${{ vars.SUPABASE_DB_NAME }}
      SUPABASE_DB_USER: ${{ vars.SUPABASE_DB_USER }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SSH_TARGET: ${{ vars.SSH_USER }}@${{ vars.SSH_HOST }}
      STAGING_API_URL: https://138-197-15-40.sslip.io/api
    steps:
      - uses: actions/checkout@v5

      - name: Configure SSH (the key is never printed)
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Install the tools the gate uses
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq jq postgresql-client python3 openssl

      # Remove anything a previous run left behind: the gate asserts counts, so leftovers would
      # turn into false failures (and a leftover agreement would collide on its start date).
      - name: Remove leftovers from a previous run
        run: bash scripts/staging/smoke.sh teardown || true

      - name: Provision the smoke tenant
        run: bash scripts/staging/smoke.sh provision

      - name: Exercise the MVP flows
        run: bash scripts/staging/smoke.sh run

      - name: Remove the tenant content (always)
        if: always()
        run: bash scripts/staging/smoke.sh teardown

      - name: Verify the worker is still disabled
        if: always()
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$SSH_TARGET" \
            "cd /opt/convenciones && grep -qx 'Worker__Enabled=false' .env && echo 'Worker__Enabled=false'"
