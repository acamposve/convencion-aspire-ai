name: Deploy staging

# Manual, gated deployment. A merge to `main` never deploys by itself; an operator must dispatch this
# workflow with `confirm=deploy` after the merge and the conversation approval. CI remains automatic.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type deploy to confirm the staging deployment'
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, migrate and deploy
    if: github.ref == 'refs/heads/main' && github.event.inputs.confirm == 'deploy'
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v5

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the API image
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}/api:${GITHUB_SHA}"
          docker build --file Dockerfile --tag "$image" .
          pushed=0
          for attempt in 1 2 3; do
            if docker push "$image"; then pushed=1; break; fi
            echo "push failed (attempt $attempt); retrying"
            sleep 15
          done
          test "$pushed" = 1
          printf 'API_IMAGE=%s\n' "$image" >> "$GITHUB_ENV"

      - name: Build and push the web image
        env:
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}/web:${GITHUB_SHA}"
          docker build --file Dockerfile.web --tag "$image" \
            --build-arg VITE_API_BASE_URL=/api \
            --build-arg VITE_SUPABASE_URL="$VITE_SUPABASE_URL" \
            --build-arg VITE_SUPABASE_ANON_KEY="$VITE_SUPABASE_ANON_KEY" .
          pushed=0
          for attempt in 1 2 3; do
            if docker push "$image"; then pushed=1; break; fi
            echo "push failed (attempt $attempt); retrying"
            sleep 15
          done
          test "$pushed" = 1
          printf 'WEB_IMAGE=%s\n' "$image" >> "$GITHUB_ENV"

      - name: Configure SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Write the environment file
        env:
          DB_HOST: ${{ vars.SUPABASE_DB_HOST }}
          DB_PORT: ${{ vars.SUPABASE_DB_PORT }}
          DB_NAME: ${{ vars.SUPABASE_DB_NAME }}
          DB_USER: ${{ vars.SUPABASE_DB_USER }}
          DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          PUBLIC_BASE_URL: https://138-197-15-40.sslip.io
          AZURE_AI_ENDPOINT: ${{ vars.AZURE_AI_ENDPOINT }}
          AZURE_AI_DEPLOYMENT: ${{ vars.AZURE_AI_DEPLOYMENT }}
          AZURE_AI_API_KEY: ${{ secrets.AZURE_AI_API_KEY }}
          DOCUMENT_INTELLIGENCE_ENDPOINT: ${{ vars.DOCUMENT_INTELLIGENCE_ENDPOINT }}
          DOCUMENT_INTELLIGENCE_API_KEY: ${{ secrets.DOCUMENT_INTELLIGENCE_API_KEY }}
        run: |
          set -euo pipefail
          umask 077
          password_b64="$(printf '%s' "$DB_PASSWORD" | base64 -w0)"
          if [ -z "${AZURE_AI_ENDPOINT:-}" ] || [ -z "${AZURE_AI_DEPLOYMENT:-}" ] || [ -z "${AZURE_AI_API_KEY:-}" ]; then
            echo "::warning::Azure AI settings are incomplete; the worker will stay at stage_not_configured."
          fi
          if [ -z "${DOCUMENT_INTELLIGENCE_ENDPOINT:-}" ] || [ -z "${DOCUMENT_INTELLIGENCE_API_KEY:-}" ]; then
            echo "::warning::Document Intelligence settings are incomplete; the worker will stay at stage_not_configured."
          fi
          {
            printf 'IMAGE_TAG=%s\n' "$GITHUB_SHA"
            printf 'API_IMAGE=%s\n' "$API_IMAGE"
            printf 'WEB_IMAGE=%s\n' "$WEB_IMAGE"
            printf 'Database__Host=%s\n' "$DB_HOST"
            printf 'Database__Port=%s\n' "$DB_PORT"
            printf 'Database__Name=%s\n' "$DB_NAME"
            printf 'Database__User=%s\n' "$DB_USER"
            printf 'Database__PasswordBase64=%s\n' "$password_b64"
            printf 'Jwt__Issuer=%s/auth/v1\n' "$SUPABASE_URL"
            printf 'Jwt__Audience=authenticated\n'
            printf 'Jwt__MetadataAddress=%s/auth/v1/.well-known/openid-configuration\n' "$SUPABASE_URL"
            printf 'Cors__AllowedOrigins__0=%s\n' "$PUBLIC_BASE_URL"
            printf 'Documents__SupabaseUrl=%s\n' "$SUPABASE_URL"
            printf 'Documents__SupabaseSecretKey=%s\n' "$SECRET_KEY"
            printf 'Documents__Bucket=documents\n'
            printf 'AzureAi__Endpoint=%s\n' "$AZURE_AI_ENDPOINT"
            printf 'AzureAi__Deployment=%s\n' "$AZURE_AI_DEPLOYMENT"
            printf 'AzureAi__ApiKey=%s\n' "$AZURE_AI_API_KEY"
            printf 'DocumentIntelligence__Endpoint=%s\n' "$DOCUMENT_INTELLIGENCE_ENDPOINT"
            printf 'DocumentIntelligence__ApiKey=%s\n' "$DOCUMENT_INTELLIGENCE_API_KEY"
            printf 'Worker__Enabled=false\n'
            printf 'Processing__MaxActiveRunsPerCompany=1\n'
            printf 'Retention__IntervalMinutes=360\n'
            printf 'Retention__BatchSize=100\n'
            printf 'Api__PathBase=/api\n'
            printf 'ASPNETCORE_URLS=http://+:8080\n'
          } > .env
          chmod 600 .env

      - name: Keep the previous environment for rollback
        run: |
          ssh "${{ vars.SSH_USER }}@${{ vars.SSH_HOST }}" \
            'mkdir -p /opt/convenciones && cd /opt/convenciones && if [ -f .env ]; then cp .env .env.previous; fi && if [ -f docker-compose.yml ]; then cp docker-compose.yml docker-compose.previous.yml; fi && if [ -f Caddyfile ]; then cp Caddyfile Caddyfile.previous; fi'

      - name: Upload compose and environment
        run: |
          set -euo pipefail
          scp deploy/docker-compose.yml deploy/Caddyfile .env "${{ vars.SSH_USER }}@${{ vars.SSH_HOST }}:/opt/convenciones/"
          ssh "${{ vars.SSH_USER }}@${{ vars.SSH_HOST }}" 'chmod 600 /opt/convenciones/.env'

      - name: Log in to GHCR on the droplet
        run: |
          printf '%s' "${{ secrets.GITHUB_TOKEN }}" | \
            ssh "${{ vars.SSH_USER }}@${{ vars.SSH_HOST }}" \
              'docker login ghcr.io --username "${{ github.actor }}" --password-stdin'

      - name: Migrate and start
        run: |
          ssh "${{ vars.SSH_USER }}@${{ vars.SSH_HOST }}" 'set -euo pipefail; cd /opt/convenciones; docker compose pull -q; docker compose run --rm --no-deps migrator; docker compose stop web caddy >/dev/null 2>&1 || true; rm -f docker-compose.worker-on.yml; docker compose up -d --remove-orphans; docker compose up -d --force-recreate worker; for i in $(seq 1 60); do if curl -fsS --resolve 138-197-15-40.sslip.io:443:127.0.0.1 https://138-197-15-40.sslip.io/health/ready >/dev/null; then exit 0; fi; sleep 2; done; echo "readiness did not become available"; exit 1'

      - name: Verify over the public address
        run: |
          set -euo pipefail
          for i in $(seq 1 20); do
            if curl -fsS "https://138-197-15-40.sslip.io/health/ready" >/dev/null; then
              echo "public readiness OK"
              exit 0
            fi
            sleep 3
          done
          echo "public readiness failed"
          exit 1

      - name: Roll back on failure
        if: failure()
        run: |
          ssh "${{ vars.SSH_USER }}@${{ vars.SSH_HOST }}" \
            'set -euo pipefail; cd /opt/convenciones; if [ -f .env.previous ]; then mv .env.previous .env; fi; if [ -f docker-compose.previous.yml ]; then mv docker-compose.previous.yml docker-compose.yml; fi; if [ -f Caddyfile.previous ]; then mv Caddyfile.previous Caddyfile; fi; rm -f docker-compose.worker-on.yml; docker compose up -d --remove-orphans; docker compose up -d --force-recreate worker'
