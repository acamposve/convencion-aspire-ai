name: Deploy staging

# Deploys the merged `main` to the single staging droplet. It runs after the CI workflow, but it
# does not wait for it programmatically: `main` only receives merges whose CI is green, and this
# workflow is deliberately separate so a deployment failure never blocks or reruns the test gate.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, migrate and deploy
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v5

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the API image
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}/api:${GITHUB_SHA}"
          docker build --file Dockerfile --tag "$image" .
          pushed=0
          for attempt in 1 2 3; do
            if docker push "$image"; then pushed=1; break; fi
            echo "push failed (attempt $attempt); retrying"
            sleep 15
          done
          test "$pushed" = 1
          printf 'API_IMAGE=%s\n' "$image" >> "$GITHUB_ENV"

      - name: Build and push the web image
        env:
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}/web:${GITHUB_SHA}"
          docker build --file Dockerfile.web --tag "$image" \
            --build-arg VITE_API_BASE_URL=/api \
            --build-arg VITE_SUPABASE_URL="$VITE_SUPABASE_URL" \
            --build-arg VITE_SUPABASE_ANON_KEY="$VITE_SUPABASE_ANON_KEY" .
          pushed=0
          for attempt in 1 2 3; do
            if docker push "$image"; then pushed=1; break; fi
            echo "push failed (attempt $attempt); retrying"
            sleep 15
          done
          test "$pushed" = 1
          printf 'WEB_IMAGE=%s\n' "$image" >> "$GITHUB_ENV"

      - name: Configure SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Write the environment file
        env:
          DB_HOST: ${{ vars.SUPABASE_DB_HOST }}
          DB_PORT: ${{ vars.SUPABASE_DB_PORT }}
          DB_NAME: ${{ vars.SUPABASE_DB_NAME }}
          DB_USER: ${{ vars.SUPABASE_DB_USER }}
          DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          PUBLIC_BASE_URL: http://${{ vars.SSH_HOST }}
        run: |
          set -euo pipefail
          umask 077
          {
            printf 'IMAGE_TAG=%s\n' "$GITHUB_SHA"
            printf 'API_IMAGE=%s\n' "$API_IMAGE"
            printf 'WEB_IMAGE=%s\n' "$WEB_IMAGE"
            printf 'Database__Host=%s\n' "$DB_HOST"
            printf 'Database__Port=%s\n' "$DB_PORT"
            printf 'Database__Name=%s\n' "$DB_NAME"
            printf 'Database__User=%s\n' "$DB_USER"
            printf 'Database__PasswordFile=/run/secrets/db_password\n'
            printf 'Jwt__Issuer=%s/auth/v1\n' "$SUPABASE_URL"
            printf 'Jwt__Audience=authenticated\n'
            printf 'Jwt__MetadataAddress=%s/auth/v1/.well-known/jwks.json\n' "$SUPABASE_URL"
            printf 'Cors__AllowedOrigins__0=%s\n' "$PUBLIC_BASE_URL"
            printf 'Documents__SupabaseUrl=%s\n' "$SUPABASE_URL"
            printf 'Documents__SupabaseSecretKey=%s\n' "$SECRET_KEY"
            printf 'Documents__Bucket=documents\n'
            printf 'Api__PathBase=/api\n'
            printf 'ASPNETCORE_URLS=http://+:8080\n'
          } > .env
          install -d -m 700 secrets
          printf '%s' "$DB_PASSWORD" > secrets/db_password
          chmod 600 secrets/db_password .env

      - name: Keep the previous environment for rollback
        run: |
          ssh "${{ vars.SSH_USER }}@${{ vars.SSH_HOST }}" \
            'mkdir -p /opt/convenciones /opt/convenciones/secrets && chmod 700 /opt/convenciones/secrets && cd /opt/convenciones && if [ -f .env ]; then cp .env .env.previous; fi'

      - name: Upload compose and environment
        run: |
          set -euo pipefail
          scp deploy/docker-compose.yml .env "${{ vars.SSH_USER }}@${{ vars.SSH_HOST }}:/opt/convenciones/"
          scp secrets/db_password "${{ vars.SSH_USER }}@${{ vars.SSH_HOST }}:/opt/convenciones/secrets/db_password"
          ssh "${{ vars.SSH_USER }}@${{ vars.SSH_HOST }}" 'chmod 600 /opt/convenciones/.env /opt/convenciones/secrets/db_password'

      - name: Log in to GHCR on the droplet
        run: |
          printf '%s' "${{ secrets.GITHUB_TOKEN }}" | \
            ssh "${{ vars.SSH_USER }}@${{ vars.SSH_HOST }}" \
              'docker login ghcr.io --username "${{ github.actor }}" --password-stdin'

      - name: Migrate and start
        run: |
          ssh "${{ vars.SSH_USER }}@${{ vars.SSH_HOST }}" 'set -euo pipefail; cd /opt/convenciones; docker compose pull -q; docker compose run --rm --no-deps migrator; docker compose up -d --remove-orphans; for i in $(seq 1 30); do if curl -fsS http://127.0.0.1/health/ready >/dev/null; then exit 0; fi; sleep 2; done; echo "readiness did not become available"; exit 1'

      - name: Verify over the public address
        run: |
          set -euo pipefail
          for i in $(seq 1 20); do
            if curl -fsS "http://${{ vars.SSH_HOST }}/health/ready" >/dev/null; then
              echo "public readiness OK"
              exit 0
            fi
            sleep 3
          done
          echo "public readiness failed"
          exit 1

      - name: Roll back on failure
        if: failure()
        run: |
          ssh "${{ vars.SSH_USER }}@${{ vars.SSH_HOST }}" \
            'set -euo pipefail; cd /opt/convenciones; if [ -f .env.previous ]; then mv .env.previous .env; docker compose up -d --remove-orphans; fi'
