server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The API accepts PDFs up to 20 MiB; the proxy must not reject them first.
    client_max_body_size 25m;

    server_tokens off;
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # The API is reached through one path prefix. The API itself strips /api (Api__PathBase), so the
    # route table and every test are unchanged and the SPA can keep /documents, /agreements, ... as
    # its own client-side routes.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_request_buffering off;
    }

    # Readiness and liveness without the prefix, for the platform and for a plain curl.
    location = /health/live {
        proxy_pass http://api:8080/health/live;
    }

    location = /health/ready {
        proxy_pass http://api:8080/health/ready;
    }

    # Immutable hashed assets.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The SPA: any other path is a client-side route.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
